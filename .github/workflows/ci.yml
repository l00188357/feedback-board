name: Feedback Board CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # ==========================================
  # Job 1: Build, Unit Tests and Security
  # ==========================================
  build:
    name: Build, Test & Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Run ESLint
        run: npm run lint

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Verify build output
        run: test -f dist/index.html

  # ==========================================
  # Job 2: Docker Build and Integration Tests
  # ==========================================
  docker-integration:
    name: Docker Build & Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d --wait

      - name: Run Docker Compose smoke tests
        run: node scripts/smoke-test.mjs

      - name: Show container status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100

      - name: Stop Docker Compose
        if: always()
        run: docker compose down