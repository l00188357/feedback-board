apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: feedback-board
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: pocketbase
          image: feedback-board-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090

          volumeMounts:
            - name: pocketbase-data
              mountPath: /pb/pb_data

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: pocketbase-data
          persistentVolumeClaim:
            claimName: pocketbase-data