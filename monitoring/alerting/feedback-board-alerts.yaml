apiVersion: 1
groups:
    - orgId: 1
      name: feedback-board-availability
      folder: Feedback Board
      interval: 1m
      rules:
        - uid: cg3pawizhlypsd
          title: Feedback Board - Frontend Down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: probe_success{job="feedback-board-http",instance="http://frontend.feedback-board.svc.cluster.local/"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 2m
          annotations:
            description: The Blackbox Exporter detected that the Feedback Board frontend HTTP endpoint is unavailable for at least 2 minutes. Check the frontend Kubernetes pod, service, and application logs.
            summary: Feedback Board frontend is unavailable
          isPaused: false

        - uid: dg3pbjipxbk74b
          title: Feedback Board - Backend Down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: probe_success{job="feedback-board-http",instance="http://backend.feedback-board.svc.cluster.local:8090/api/health"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 2m
          annotations:
            description: The Blackbox Exporter detected that the Feedback Board backend health endpoint is unavailable for at least 2 minutes. Check the backend Kubernetes pod, service, and application logs.
            summary: Feedback Board backend is unavailable.
          isPaused: false

