# Lightweight Blackbox Exporter
# Feedback Board monitoring

replicas: 1

resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    cpu: 100m
    memory: 64Mi

service:
  type: ClusterIP
  port: 9115

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        preferred_ip_protocol: ip4
        follow_redirects: true